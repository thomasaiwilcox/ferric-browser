# Source: Ferric Browser keyboard-interaction v0.3 S18 example catalog; version 1.
# Disabled by default: this file is not loaded or merged into user config.
# Adapter IDs: none. Review date: 2026-10-12. Live-site qualification: not-run.
# example.test is reserved for fixtures.
# Remove this entire rule to disable it; unset individual values to inherit.

schema_version = 3

[[site_rules]]
id = "test-app-shortcuts"
pattern = "https://example.test/app/*"
priority = 20

[site_rules.set]
"input.shortcut_policy" = "mixed"
"input.page_keys" = ["/", "?", "f", "Ctrl+f"]
"hints.proxy_targets" = "validated"
"hints.selectors.all" = { mode = "extend", selectors = [".custom-action[data-ready='true']"] }
"hints.selectors.buttons" = { mode = "replace", selectors = ["button", "[role='button']", ".custom-action"] }

# ':' and browser recovery chords are intentionally absent and must be rejected
# if assigned to input.page_keys. Hidden proxy and native pointer privileges are
# not granted by CSS selectors. An empty replace list disables that family.
