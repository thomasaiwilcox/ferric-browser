# Opt-in example manually checked on 15 November 2026.
# Exact Apple UK home path; Hint family all only.
# Capture and preview again before applying. Never installed automatically.
format = "ferric-site-interaction"
format_version = 1
required_capabilities = [
    "explicit-roots-v1",
    "interaction-policy-v1",
    "predicates-v1",
    "semantic-anchors-v1",
]

[[rules]]
operation = "upsert-interaction"
id = "apple-live-navigation-20261115"
pattern = "https://www.apple.com/uk/"
priority = 0

[rules.interaction]
enabled = true

[[rules.interaction.anchors]]
id = "mac"
code = "m"
families = ["all"]
target_selector = "a.globalnav-link-mac"

[rules.interaction.anchors.root]
start = "top-document"
steps = []

[rules.interaction.anchors.predicates.hint_name]
equals = "Mac"

[rules.interaction.anchors.predicates.href]
origin = "https://www.apple.com"
path = "/uk/mac/"
