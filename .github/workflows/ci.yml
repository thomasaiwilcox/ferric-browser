name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Install Qt and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev qt6-webengine-dev qt6-wayland-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtwebengine desktop-file-utils
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Lint QML syntax
        run: /usr/lib/qt6/bin/qmllint --silent -I /usr/lib/x86_64-linux-gnu/qt6/qml crates/ferric-browser-engine-qt/qml/Main.qml
      - run: cargo xtask check
      - run: desktop-file-validate packaging/io.github.ferricbrowser.FerricBrowser.desktop

  dependency-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - uses: EmbarkStudios/cargo-deny-action@v2

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  generated-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - run: cargo xtask docs
      - run: git diff --exit-code -- docs/user
