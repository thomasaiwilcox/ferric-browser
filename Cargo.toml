[workspace]
resolver = "3"
members = [
    "crates/ferric-browser-core",
    "crates/ferric-browser-config",
    "crates/ferric-browser-ipc",
    "crates/ferric-browser-storage",
    "crates/ferric-browser-engine-qt",
    "crates/ferric-browser-runtime",
    "crates/ferric-browser",
    "crates/xtask",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
adblock = { version = "0.13.3", default-features = false, features = ["debug-info", "embedded-domain-resolver", "full-regex-handling"] }
cxx = "1.0.198"
cxx-qt = "0.10.0"
cxx-qt-build = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_full"] }
fs2 = "0.4.3"
libc = "0.2.189"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
rusqlite = { version = "0.37", features = ["backup"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"

# CXX-Qt exposes Rust invokables through generated `noexcept` C++ entry
# points. A Rust panic must therefore terminate the process and leave the
# browser's crash marker for recovery; it must never unwind through Qt FFI.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = 2
