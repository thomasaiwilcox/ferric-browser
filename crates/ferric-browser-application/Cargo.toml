[package]
name = "ferric-browser-application"
version = "0.1.0"
description = "Qt-independent Ferric Browser application use cases and orchestration"
license.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true

[features]
# Disposable integration harness only; default builds keep the command closed.
unqualified-clean-branch-test = []

[dependencies]
ferric-browser-config = { version = "0.1.0", path = "../ferric-browser-config" }
ferric-browser-core = { version = "0.1.0", path = "../ferric-browser-core" }
ferric-browser-runtime = { version = "0.1.0", path = "../ferric-browser-runtime" }
ferric-browser-storage = { version = "0.1.0", path = "../ferric-browser-storage" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
rusqlite.workspace = true

[lints]
workspace = true
