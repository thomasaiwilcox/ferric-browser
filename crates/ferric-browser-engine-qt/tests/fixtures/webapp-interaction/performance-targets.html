<!doctype html>
<meta charset="utf-8">
<title>Synthetic bounded discovery workload</title>
<style>body{margin:0}#targets{display:grid;gap:0;width:max-content}button{margin:0;padding:0;border:0;font-size:0;background:#ddd}</style>
<div id="targets"></div>
<script>
const count=Math.min(5000,Math.max(1,Number(new URL(location.href).searchParams.get('count'))||500));
const columns=count<=500?25:count<=1000?40:100;
const size=count<=500?18:count<=1000?12:4;
const root=document.getElementById('targets');
root.style.gridTemplateColumns=`repeat(${columns},${size}px)`;
for(let index=0;index<count;index++){
 const button=document.createElement('button');
 button.setAttribute('aria-label',`Synthetic target ${index}`);
 button.style.width=button.style.height=`${size}px`;
 root.appendChild(button);
}
document.body.dataset.ready='true';
</script>
