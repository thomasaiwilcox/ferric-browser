schema_version = 3

[[site_rules]]
id = "fixture-watch"
pattern = "https://video.example.test/watch*"
priority = 100

[site_rules.interaction]
enabled = true
hint_page_keys = ["p", "f"]
page_receiver = { scope = "top-document" }

[site_rules.interaction.labels]
alphabet = "asdfghjkl"
min_chars = 2
fallback_prefix = "z"
auto_follow = "full-match"

[[site_rules.interaction.collections]]
id = "suggestions"
families = ["links", "actions", "all"]
container_selector = "#fixture-suggestions"
item_selector = ".fixture-video-card"
primary_selector = "a.fixture-thumbnail"
identity_attributes = ["data-video-id"]
order = "top-to-bottom"
codes = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

[[site_rules.interaction.remaps]]
id = "play-on-p"
from = "p"
to = "k"
contexts = ["passthrough-once", "passthrough", "hint-page-key"]
