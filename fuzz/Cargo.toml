test = false
doc = false
bench = false

[[bin]]
name = "switcher_matching"
path = "fuzz_targets/switcher_matching.rs"
test = false
doc = false
bench = false

[[bin]]
name = "site_rule"
path = "fuzz_targets/site_rule.rs"
test = false
doc = false
bench = false

[[bin]]
name = "contexts_routes"
path = "fuzz_targets/contexts_routes.rs"
test = false
