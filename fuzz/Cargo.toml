[package]
name = "rustbrowser-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
browser-config = { path = "../crates/browser-config" }
browser-core = { path = "../crates/browser-core" }
browser-engine-qt = { path = "../crates/browser-engine-qt" }
browser-ipc = { path = "../crates/browser-ipc" }
browser-storage = { path = "../crates/browser-storage" }
libfuzzer-sys = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

[[bin]]
name = "command_parser"
path = "fuzz_targets/command_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ipc_frames"
path = "fuzz_targets/ipc_frames.rs"
test = false
doc = false
bench = false

