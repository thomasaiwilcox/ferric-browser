# Declarative launcher contract; launcher adapters may translate these entries.
# No Walker, Waybar, or shell implementation is required by FerricBrowser.
schema = 1

[query-tabs]
label = "FerricBrowser tabs"
argv = ["ferric-browser", "query", "switcher", "--scope", "tabs", "--limit", "50", "--format", "json"]
result_kind = "tab"
id_field = "id"
privacy = "normal-only"

[activate-tab]
label = "Activate FerricBrowser tab"
argv = ["ferric-browser", "activate", "tab", "{id}"]
result_kind = "tab"
id_field = "id"
