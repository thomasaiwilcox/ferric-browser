schema = 1
package = "ferric-browser"
support_status = "development"

[qt]
family = "Qt 6"
minimum_version = "6.11.2"
model = "system-dynamic"
qualification = "The native download-source guard is qualified for QtWebEngine 6.11.2 and needs matching private SDK headers. Refresh its verified interface and repeat release qualification before changing the SDK."

[required]
arch_packages = [
  "ca-certificates",
  "hicolor-icon-theme",
  "xdg-utils",
  "qt6-base>=6.11",
  "qt6-declarative>=6.11",
  "qt6-wayland",
  "qt6-webengine>=6.11",
  "qt6-webchannel>=6.11",
  "kwindowsystem>=6.28",
]

qml_modules = [
  "QtQuick",
  "QtQuick.Controls",
  "QtQuick.Dialogs",
  "QtQuick.Layouts",
  "QtWebEngine",
]
qt_modules = [
  "Core",
  "DBus",
  "Gui",
  "Network",
  "Positioning",
  "Quick",
  "QuickControls2",
  "QuickWidgets",
  "WaylandClient",
  "WebChannel",
  "WebEngineCore",
  "WebEngineQuick",
  "WebEngineWidgets",
  "Widgets",
]

[build]
arch_packages = ["desktop-file-utils", "git", "rust>=1.88", "pkgconf", "python"]
check_packages = ["dbus", "weston", "wayland", "wayland-protocols"]
note = "desktop-file-utils is required by the package check phase; rust builds the locked application source; dbus and weston provide the disposable native-Wayland qualification harness."

[optional.portals]
arch_packages = [
  "xdg-desktop-portal",
  "xdg-desktop-portal-gtk",
  "xdg-desktop-portal-hyprland",
]
interfaces = [
  "org.freedesktop.portal.FileChooser",
  "org.freedesktop.portal.OpenURI",
  "org.freedesktop.portal.ScreenCast",
  "org.freedesktop.portal.Notification",
]
note = "Select the backend matching the compositor and desktop environment; Hyprland capture does not provide a file chooser backend."

[optional.media]
arch_packages = ["pipewire", "wireplumber"]
interfaces = ["PipeWire core"]
note = "Required only for qualified WebRTC screen/window capture; absence is reported by diagnostics."

[optional.features]
arch_packages = ["hunspell"]
external_tools = ["neovim", "mpv"]
note = "Dictionaries and external tools are feature inputs, not browser compile-time requirements."

[phone_auth]
workspace = "helpers/ferric-phone-auth"
rust_minimum = "1.88.0"
installed_helper = "/usr/bin/ferric-phone-auth-helper"
arch_packages = ["dbus", "systemd-libs", "ca-certificates"]
optional_runtime_packages = ["bluez"]
psl_fallback = "/usr/share/ferric-browser/public_suffix_list.dat"
note = "Separate locked helper graph; transient cloud-assisted caBLE only. Existing BlueZ adapter access is required. Browser policy must explicitly admit direct networking; other policies disable phone routing. The official packaged PSL is refreshed at release; no ceremony fetches it."
